<style id="app-style">
:root{
  color-scheme:dark;
  --bg:#1b1840; --orb1:#3f6df0; --orb2:#5ad1e6; --orb3:#7a3fd6;
  --glass:rgba(255,255,255,.08); --glass2:rgba(255,255,255,.14); --stroke:rgba(255,255,255,.18); --hair:rgba(255,255,255,.1);
  --text:#ffffff; --muted:rgba(255,255,255,.72); --faint:rgba(255,255,255,.65);
  --respawn:#5ad1e6; --fixed:#c9a8ff; --live:#ff8a7a; --soon:#5ad1e6; --on-pill:#1b1840; --input:rgba(0,0,0,.22);
  --chip:rgba(255,255,255,.1); --chip-soon:rgba(90,209,230,.32); --chip-live:rgba(255,112,112,.28);
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --num:"Manrope","Noto Sans KR",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1b1840; } }
:root[data-theme="dark"],:root[data-theme="light"]{ --bg:#1b1840; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--respawn);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

.bgfx{position:absolute;top:0;bottom:0;left:50%;width:min(100%,720px);transform:translateX(-50%);z-index:0;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%}
.bgfx i:nth-child(1){width:360px;height:360px;background:#3f6df0;filter:blur(90px);opacity:.55;left:-120px;top:-80px}
.bgfx i:nth-child(2){width:320px;height:320px;background:#5ad1e6;filter:blur(100px);opacity:.45;right:-140px;top:380px}
.bgfx i:nth-child(3){width:300px;height:300px;background:#7a3fd6;filter:blur(100px);opacity:.45;left:-100px;top:1080px}
html{background:#1b1840}
body{position:relative;overflow-x:hidden;background:#1b1840}

.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:26px 16px 120px;display:flex;flex-direction:column;gap:14px}

header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:0 4px}
.game{font-size:12.5px;color:var(--muted);font-weight:500}
h1{margin:4px 0 0;font-size:clamp(24px,5.4vw,32px);line-height:1.22;font-weight:900;letter-spacing:-.03em}
.pill{min-height:44px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.admin{color:var(--respawn)}
.modebox{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.mode{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.mode .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.mode.admin{color:var(--respawn);border-color:color-mix(in srgb,var(--respawn) 55%,transparent)}
.mode.admin .dot{background:var(--respawn);box-shadow:0 0 0 3px color-mix(in srgb,var(--respawn) 30%,transparent)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);z-index:50;min-width:240px;max-width:calc(100% - 32px);padding:14px 18px;border-radius:20px;background:var(--glass2);font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ti{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px;color:#fff}
.toast.ok .ti{background:#1f9d6b}
.toast.bad .ti{background:#d1453b}
.alert{margin-top:10px;padding:10px 14px;border-radius:14px;font-size:14px;font-weight:700;background:color-mix(in srgb,var(--live) 18%,transparent);border:1px solid color-mix(in srgb,var(--live) 45%,transparent);color:var(--text)}
.alert[hidden]{display:none}

.hero{border-radius:32px;padding:22px 20px;display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{display:block}
.ring .track{stroke:rgba(255,255,255,.15)}
.ring .bar{stroke:#5ad1e6;transition:stroke-dashoffset .6s}


.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:25px;font-weight:800;line-height:1.1}
.ring .cap{font-size:11px;color:var(--muted)}
.hero .lbl{font-size:12px;color:var(--muted)}
.hero .who{font-size:21px;font-weight:900;letter-spacing:-.02em;margin-top:2px;line-height:1.3}
.hero .meta{font-size:12.5px;color:var(--muted)}
.hero .at{margin-top:10px;font-size:22px;font-weight:800}
.hero .atd{font-size:12px;color:var(--muted)}

.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border-radius:24px;padding:14px 16px;min-width:0}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:800}
.tile.live{background:rgba(255,112,112,.18);border-color:rgba(255,160,160,.35)}
.tile.live .k{color:#ffd0d0}
.tile.live .v{font-family:var(--sans);font-size:15px;font-weight:900;line-height:1.35}

.admin-panel{border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px}
.admin-panel h2{margin:0;font-size:15px;font-weight:900}
.admin-panel .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:40px;padding:0 14px;border-radius:14px;background:var(--glass2);border:1px solid var(--stroke);font-size:13px;font-weight:700}
.btn.primary{background:var(--text);color:var(--on-pill);border-color:transparent}
.btn.big{min-height:48px;padding:0 18px;font-size:14px}
.field{background:var(--input);border:1px solid var(--stroke);border-radius:12px;padding:8px 11px;min-width:0}

.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;overflow-x:auto}
.tabs button{flex:1;min-height:40px;padding:0 12px;border:none;border-radius:999px;background:transparent;font-size:13px;font-weight:700;white-space:nowrap}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.9);color:#1b1840}

.region-note{border-radius:28px;padding:14px 18px;font-size:14px;color:var(--muted);background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.12)}
.region-note b{color:var(--text)}

.sec{border-radius:28px;padding:16px 16px 6px}
.sec-off{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.12)}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sec-h .ic{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.sec-h.respawn .ic{background:rgba(90,209,230,.32);color:#ffffff}
.sec-h.fixed .ic{background:rgba(255,255,255,.14);color:#ffffff}
.sec-h.off .ic{background:var(--glass2);color:var(--muted)}
.sec-h h2{margin:0;font-size:16px;font-weight:900}
.sec-h p{margin:0;font-size:12px;color:var(--muted)}
.empty{padding:14px 2px 16px;color:var(--muted);font-size:14px}

.row{border-top-color:rgba(255,255,255,.1)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--hair)}
.chip{width:52px;height:52px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.chip{background:var(--chip)}
.row.soon .chip{background:var(--chip-soon)}
.row.live .chip{background:rgba(255,112,112,.28)}
.row.live .hm{color:#ffffff}
.row.off .chip{background:rgba(255,255,255,.06)}

.chip .hm{font-size:15px;font-weight:800;line-height:1.15}
.chip .dy{font-size:10.5px;color:var(--muted)}
.nm{font-size:15px;font-weight:700;line-height:1.35}
.nm .lv{margin-right:4px}
.sub{font-size:12px;color:rgba(255,255,255,.65)}
.rt{text-align:right}
.lf{font-size:13px;font-weight:700;white-space:nowrap;color:rgba(255,255,255,.85)}
.tg{font-size:11.5px;color:var(--faint);white-space:nowrap}
.row.soon .lf{color:var(--soon)}
.row.live .lf{color:var(--live)}
.row.est .dy::after{content:" 예상"}
.row.off .nm,.row.off .lf,.row.off .hm{color:var(--faint)}
.note{grid-column:2/4;justify-self:start;font-size:14px;font-weight:700;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.1)}
.info{grid-column:2/4;font-size:12px;color:var(--muted)}
.acts{grid-column:1/4;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 0 2px}
.acts .btn{min-height:36px;font-size:12.5px;border-radius:12px}
.acts .field{flex:1;min-width:160px;font-size:13px}
.sw{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass2);font-size:12.5px;font-weight:700}
.sw .knob{width:34px;height:20px;border-radius:999px;background:var(--hair);position:relative;transition:background .2s}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text);transition:transform .2s}
.sw[aria-checked="true"] .knob{background:var(--respawn)}
.sw[aria-checked="true"] .knob::after{transform:translateX(14px);background:#fff}

footer{padding:6px 6px 0;font-size:12.5px;color:var(--muted);line-height:1.75}
footer p{margin:0 0 4px}

.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;width:min(688px,calc(100% - 24px));border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--glass2)}
.savebar .msg{flex:1;min-width:170px;font-size:13.5px}
.savebar[hidden]{display:none}

dialog{background:#1b1840;color:var(--text);border:1px solid var(--stroke);border-radius:26px;padding:20px;width:min(520px,94vw);max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(8,6,24,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h3{margin:0 0 6px;font-size:19px;font-weight:900}
dialog label.l{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px}
dialog .r2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
dialog .err{color:var(--live);font-size:13px;min-height:1.2em;margin-top:6px}
dialog .hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
dialog input[type=number]{width:70px}
.seg{display:flex;border-radius:14px;overflow:hidden;border:1px solid var(--stroke)}
.seg button{flex:1;background:none;border:none;padding:9px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--glass2);color:var(--text);font-weight:700}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:12px}
.thumbs{flex-wrap:wrap}
.thumbs img{height:120px;border-radius:12px;border:1px solid var(--stroke);cursor:zoom-in}
.thumbs img.big{height:auto;width:100%;cursor:zoom-out}
.ask{margin-top:14px;padding:14px;border-radius:18px;background:var(--glass2);font-size:15px;line-height:1.55}
.ask b{font-weight:900}
.picker{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:14px;background:var(--text);color:var(--on-pill);font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}
.picker input{position:absolute;width:1px;height:1px;opacity:0}
.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.res th{font-weight:500;color:var(--muted);text-align:left;padding:6px 4px;font-size:12px}
.res td{padding:7px 4px;border-top:1px solid var(--hair);vertical-align:middle}
.res input[type=number]{width:50px;padding:5px 6px}
.res .when{white-space:nowrap;font-weight:700}
.tbl{overflow-x:auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--hair);border-top-color:var(--text);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- refined board: softer gold, layered warm darks, less amber ---- */
:root{--gold:#e3b25e;--gold-hi:#f0c77a;--coral:#f08a6c;--cream:#ece3d2;--cream2:#e6d9bf;--muted:#9f9584;--faint:#857d6f;--line:rgba(255,235,200,.07)}
html,body{background:#14120f}
body{color:var(--cream);background-image:
  radial-gradient(700px 380px at 50% -120px,rgba(227,178,94,.10),transparent 70%),
  linear-gradient(180deg,#1c1914 0%,#16140f 45%,#121009 100%)}
.glass{background:linear-gradient(180deg,#1b1813,#15130f);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,240,210,.05),0 8px 24px rgba(0,0,0,.28)}
.hero{background:linear-gradient(160deg,#221d15 0%,#16130f 70%);border:1px solid rgba(227,178,94,.18);box-shadow:inset 0 1px 0 rgba(255,240,210,.06),0 10px 30px rgba(0,0,0,.32)}
h1,.hero .who,.sec-h h2,.row .nm{color:var(--cream)}
.game,.hero .lbl,.hero .meta,.hero .atd,.ring .cap,.tile .k,.sec-h p{color:var(--muted)}

.ring .track{stroke:#2a251d}
.ring .bar{stroke:url(#ringGold)}
.ring .big,.hero .at{color:var(--gold-hi)}
.tile .v{color:var(--cream2)}
.tile.live{background:linear-gradient(180deg,#24170f,#17120e);border-color:rgba(240,138,108,.28)}
.tile.live .k{color:var(--coral)}
.tile.live .v{color:var(--cream)}

.pill,.btn,.sw{border-color:rgba(227,178,94,.32);color:var(--gold-hi);background:rgba(227,178,94,.04)}
.btn.primary,.picker{background:linear-gradient(180deg,#ecc276,#d4a252);border-color:transparent;color:#1d1408;box-shadow:0 4px 14px rgba(212,162,82,.22)}
.mode{background:rgba(255,235,200,.04);border-color:var(--line);color:var(--muted)}
.mode.admin{color:var(--gold-hi);border-color:rgba(227,178,94,.32)}
.mode.admin .dot{background:var(--gold)}

    return {t: Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]) - KST, src:"파일 이름"};
  if (file.lastModified) return {t: Math.floor(file.lastModified / M) * M, src:"파일 저장 시각"};

}

    var dv = document.getElementById("sd").value, tv = document.getElementById("st").value;
    if (!dv || !tv) return;
    var p = dv.split("-"), q = tv.split(":"); shot.base = Date.UTC(+p[0], +p[1] - 1, +p[2], +q[0], +q[1]) - KST; shot.src = "직접 입력";
    stepConfirm();
  }
  else if (a === "apply") applyShot();
});

/* ---------- save (Firestore) ---------- */
function save(){
  if (!LIVE) { saveMsg = "미리보기 모드라 저장되지 않아요. 설정에 Firebase 값을 넣어 주세요."; renderSaveBar(); toast(saveMsg, "bad"); return; }
  saveMsg = "저장 중…"; renderSaveBar();
  var json = JSON.stringify(state);
  docRef.set({ json: json, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }).then(function(){
    saved = json; dirty = false; saveMsg = ""; renderSaveBar();
    toast("저장했습니다. 길드원 화면에 반영됩니다.", "ok");
  }).catch(function(err){
    var c = err && err.code;
    if (c === "permission-denied") saveMsg = "저장 권한이 없어요. 관리자 로그인을 다시 해 주세요.";
    else if (c === "unavailable") saveMsg = "서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.";
    else saveMsg = "저장하지 못했어요 (" + (c || "오류") + "). 다시 시도해 주세요.";
    renderSaveBar(); toast(saveMsg, "bad");
  });
}

/* ---------- live sync ---------- */
if (LIVE) {
  docRef.onSnapshot(function(snap){
    conn = "live";
    if (snap.exists) {
      var d = snap.data(), next = null;
      try { next = JSON.parse(d.json); } catch (e) {}
      if (next && next.bosses) {
        if (!dirty) { state = next; saved = d.json; render(); }
        else if (d.json !== saved) { saveMsg = "다른 곳에서 수정된 내용이 있어요. 저장하면 지금 화면 내용으로 덮어씁니다."; renderSaveBar(); }
        return;
      }
    }
    render();
  }, function(){ conn = "error"; render(); });
  auth.onAuthStateChanged(function(u){
    var was = admin;
    admin = !!(u && u.email && u.email.toLowerCase() === String(CFG.adminEmail).toLowerCase());
    if (admin && loginPending) { loginPending = false; loginOk(); }
    else if (admin !== was) render();
  });
}

/* ---------- events ---------- */
function onClick(e){
  var t = e.target.closest("[data-tab],[data-act]"); if (!t) return;
  var tb = t.getAttribute("data-tab");
  if (tb) { tab = tb; try { sessionStorage.setItem("boss-tab", tab); } catch (er) {} render(); return; }
  var act = t.getAttribute("data-act"), b = find(t.getAttribute("data-id"));
  if (act === "login") return loginDlg();
  if (act === "logout") {
    if (LIVE) { auth.signOut().then(function(){ toast("게스트 모드로 전환했습니다.", "ok"); }); return; }
    admin = false; try { sessionStorage.removeItem("boss-admin"); } catch (er) {} render(); toast("게스트 모드로 전환했습니다.", "ok"); return;
  }
  if (!admin) return;
  if (act === "shot") return shotDlg();
  if (act === "toggle" && b) {
    b.enabled = !b.enabled; touch();
    toast(b.name + (b.enabled ? " 알림을 켰습니다." : " 알림을 껐습니다. 안내 문구를 입력해 주세요."), "ok");
    if (!b.enabled) { var inp = app.querySelector('[data-note="' + b.id + '"]'); if (inp) inp.focus(); }
    return;
  }
  if (act === "kill" && b) { b.alive = false; b.anchor = b.interval ? Math.round(Date.now() / M) * M + b.interval * M : null; touch(); return; }
  if (act === "time" && b) return timeDlg(b);
  if (act === "bulkoff" || act === "bulkon") {
    var r = document.getElementById("bulkRegion").value, n = document.getElementById("bulkNote").value.trim();
    state.bosses.forEach(function(x){ if (x.region === r) { x.enabled = act === "bulkon"; if (act === "bulkoff" && n) x.note = n; } });
    touch(); return;
  }
  if (act === "revert") { state = JSON.parse(saved); dirty = false; saveMsg = ""; render(); return; }
  if (act === "save") return save();
}
app.addEventListener("click", onClick);
bar.addEventListener("click", onClick);
app.addEventListener("input", function(e){
  var id = e.target.getAttribute && e.target.getAttribute("data-note");
  if (!id) return;
  var b = find(id); if (!b) return;
  b.note = e.target.value; touch(false);
});
window.addEventListener("beforeunload", function(e){ if (dirty) { e.preventDefault(); e.returnValue = ""; } });

render();
setInterval(tick, 1000);
})();
</script>
</body>
