<style id="app-style">
:root{
  color-scheme:dark;
  --bg:#1b1840; --orb1:#3f6df0; --orb2:#5ad1e6; --orb3:#7a3fd6;
  --glass:rgba(255,255,255,.08); --glass2:rgba(255,255,255,.14); --stroke:rgba(255,255,255,.18); --hair:rgba(255,255,255,.1);
  --text:#ffffff; --muted:rgba(255,255,255,.72); --faint:rgba(255,255,255,.65);
  --respawn:#5ad1e6; --fixed:#c9a8ff; --live:#ff8a7a; --soon:#5ad1e6; --on-pill:#1b1840; --input:rgba(0,0,0,.22);
  --chip:rgba(255,255,255,.1); --chip-soon:rgba(90,209,230,.32); --chip-live:rgba(255,112,112,.28);
  --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --num:"Manrope","Noto Sans KR",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#1b1840; } }
:root[data-theme="dark"],:root[data-theme="light"]{ --bg:#1b1840; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--respawn);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

.bgfx{position:absolute;top:0;bottom:0;left:50%;width:min(100%,720px);transform:translateX(-50%);z-index:0;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%}
.bgfx i:nth-child(1){width:360px;height:360px;background:#3f6df0;filter:blur(90px);opacity:.55;left:-120px;top:-80px}
.bgfx i:nth-child(2){width:320px;height:320px;background:#5ad1e6;filter:blur(100px);opacity:.45;right:-140px;top:380px}
.bgfx i:nth-child(3){width:300px;height:300px;background:#7a3fd6;filter:blur(100px);opacity:.45;left:-100px;top:1080px}
html{background:#1b1840}
body{position:relative;overflow-x:hidden;background:#1b1840}

.glass{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:26px 16px 120px;display:flex;flex-direction:column;gap:14px}

header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:0 4px}
.game{font-size:12.5px;color:var(--muted);font-weight:500}
h1{margin:4px 0 0;font-size:clamp(24px,5.4vw,32px);line-height:1.22;font-weight:900;letter-spacing:-.03em}
.pill{min-height:44px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.admin{color:var(--respawn)}
.modebox{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.mode{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.mode .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.mode.admin{color:var(--respawn);border-color:color-mix(in srgb,var(--respawn) 55%,transparent)}
.mode.admin .dot{background:var(--respawn);box-shadow:0 0 0 3px color-mix(in srgb,var(--respawn) 30%,transparent)}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-12px);z-index:50;min-width:240px;max-width:calc(100% - 32px);padding:14px 18px;border-radius:20px;background:var(--glass2);font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .ti{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px;color:#fff}
.toast.ok .ti{background:#1f9d6b}
.toast.bad .ti{background:#d1453b}
.alert{margin-top:10px;padding:10px 14px;border-radius:14px;font-size:14px;font-weight:700;background:color-mix(in srgb,var(--live) 18%,transparent);border:1px solid color-mix(in srgb,var(--live) 45%,transparent);color:var(--text)}
.alert[hidden]{display:none}

.hero{border-radius:32px;padding:22px 20px;display:flex;align-items:center;gap:18px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{display:block}
.ring .track{stroke:rgba(255,255,255,.15)}
.ring .bar{stroke:#5ad1e6;transition:stroke-dashoffset .6s}


.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:25px;font-weight:800;line-height:1.1}
.ring .cap{font-size:11px;color:var(--muted)}
.hero .lbl{font-size:12px;color:var(--muted)}
.hero .who{font-size:21px;font-weight:900;letter-spacing:-.02em;margin-top:2px;line-height:1.3}
.hero .meta{font-size:12.5px;color:var(--muted)}
.hero .at{margin-top:10px;font-size:22px;font-weight:800}
.hero .atd{font-size:12px;color:var(--muted)}

.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border-radius:24px;padding:14px 16px;min-width:0}
.tile .k{font-size:11.5px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:800}
.tile.live{background:rgba(255,112,112,.18);border-color:rgba(255,160,160,.35)}
.tile.live .k{color:#ffd0d0}
.tile.live .v{font-family:var(--sans);font-size:15px;font-weight:900;line-height:1.35}

.admin-panel{border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:12px}
.admin-panel h2{margin:0;font-size:15px;font-weight:900}
.admin-panel .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:40px;padding:0 14px;border-radius:14px;background:var(--glass2);border:1px solid var(--stroke);font-size:13px;font-weight:700}
.btn.primary{background:var(--text);color:var(--on-pill);border-color:transparent}
.btn.big{min-height:48px;padding:0 18px;font-size:14px}
.field{background:var(--input);border:1px solid var(--stroke);border-radius:12px;padding:8px 11px;min-width:0}

.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;overflow-x:auto}
.tabs button{flex:1;min-height:40px;padding:0 12px;border:none;border-radius:999px;background:transparent;font-size:13px;font-weight:700;white-space:nowrap}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.9);color:#1b1840}

.region-note{border-radius:28px;padding:14px 18px;font-size:14px;color:var(--muted);background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.12)}
.region-note b{color:var(--text)}

.sec{border-radius:28px;padding:16px 16px 6px}
.sec-off{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.12)}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sec-h .ic{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.sec-h.respawn .ic{background:rgba(90,209,230,.32);color:#ffffff}
.sec-h.fixed .ic{background:rgba(255,255,255,.14);color:#ffffff}
.sec-h.off .ic{background:var(--glass2);color:var(--muted)}
.sec-h h2{margin:0;font-size:16px;font-weight:900}
.sec-h p{margin:0;font-size:12px;color:var(--muted)}
.empty{padding:14px 2px 16px;color:var(--muted);font-size:14px}

.row{border-top-color:rgba(255,255,255,.1)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--hair)}
.chip{width:52px;height:52px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.chip{background:var(--chip)}
.row.soon .chip{background:var(--chip-soon)}
.row.live .chip{background:rgba(255,112,112,.28)}
.row.live .hm{color:#ffffff}
.row.off .chip{background:rgba(255,255,255,.06)}

.chip .hm{font-size:15px;font-weight:800;line-height:1.15}
.chip .dy{font-size:10.5px;color:var(--muted)}
.nm{font-size:15px;font-weight:700;line-height:1.35}
.nm .lv{margin-right:4px}
.sub{font-size:12px;color:rgba(255,255,255,.65)}
.rt{text-align:right}
.lf{font-size:13px;font-weight:700;white-space:nowrap;color:rgba(255,255,255,.85)}
.tg{font-size:11.5px;color:var(--faint);white-space:nowrap}
.row.soon .lf{color:var(--soon)}
.row.live .lf{color:var(--live)}
.row.est .dy::after{content:" 예상"}
.row.off .nm,.row.off .lf,.row.off .hm{color:var(--faint)}
.note{grid-column:2/4;justify-self:start;font-size:14px;font-weight:700;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.1)}
.info{grid-column:2/4;font-size:12px;color:var(--muted)}
.acts{grid-column:1/4;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 0 2px}
.acts .btn{min-height:36px;font-size:12.5px;border-radius:12px}
.acts .field{flex:1;min-width:160px;font-size:13px}
.sw{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--stroke);background:var(--glass2);font-size:12.5px;font-weight:700}
.sw .knob{width:34px;height:20px;border-radius:999px;background:var(--hair);position:relative;transition:background .2s}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text);transition:transform .2s}
.sw[aria-checked="true"] .knob{background:var(--respawn)}
.sw[aria-checked="true"] .knob::after{transform:translateX(14px);background:#fff}

footer{padding:6px 6px 0;font-size:12.5px;color:var(--muted);line-height:1.75}
footer p{margin:0 0 4px}

.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;width:min(688px,calc(100% - 24px));border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--glass2)}
.savebar .msg{flex:1;min-width:170px;font-size:13.5px}
.savebar[hidden]{display:none}

dialog{background:#1b1840;color:var(--text);border:1px solid var(--stroke);border-radius:26px;padding:20px;width:min(520px,94vw);max-height:88vh;overflow:auto}
dialog::backdrop{background:rgba(8,6,24,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h3{margin:0 0 6px;font-size:19px;font-weight:900}
dialog label.l{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 4px}
dialog .r2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
dialog .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
dialog .err{color:var(--live);font-size:13px;min-height:1.2em;margin-top:6px}
dialog .hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
dialog input[type=number]{width:70px}
.seg{display:flex;border-radius:14px;overflow:hidden;border:1px solid var(--stroke)}
.seg button{flex:1;background:none;border:none;padding:9px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--glass2);color:var(--text);font-weight:700}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:12px}
.thumbs{flex-wrap:wrap}
.thumbs img{height:120px;border-radius:12px;border:1px solid var(--stroke);cursor:zoom-in}
.thumbs img.big{height:auto;width:100%;cursor:zoom-out}
.ask{margin-top:14px;padding:14px;border-radius:18px;background:var(--glass2);font-size:15px;line-height:1.55}
.ask b{font-weight:900}
.picker{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:14px;background:var(--text);color:var(--on-pill);font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}
.picker input{position:absolute;width:1px;height:1px;opacity:0}
.res{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.res th{font-weight:500;color:var(--muted);text-align:left;padding:6px 4px;font-size:12px}
.res td{padding:7px 4px;border-top:1px solid var(--hair);vertical-align:middle}
.res input[type=number]{width:50px;padding:5px 6px}
.res .when{white-space:nowrap;font-weight:700}
.tbl{overflow-x:auto}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--hair);border-top-color:var(--text);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- refined board: softer gold, layered warm darks, less amber ---- */
:root{--gold:#e3b25e;--gold-hi:#f0c77a;--coral:#f08a6c;--cream:#ece3d2;--cream2:#e6d9bf;--muted:#9f9584;--faint:#857d6f;--line:rgba(255,235,200,.07)}
html,body{background:#14120f}
body{color:var(--cream);background-image:
  radial-gradient(700px 380px at 50% -120px,rgba(227,178,94,.10),transparent 70%),
  linear-gradient(180deg,#1c1914 0%,#16140f 45%,#121009 100%)}
.glass{background:linear-gradient(180deg,#1b1813,#15130f);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,240,210,.05),0 8px 24px rgba(0,0,0,.28)}
.hero{background:linear-gradient(160deg,#221d15 0%,#16130f 70%);border:1px solid rgba(227,178,94,.18);box-shadow:inset 0 1px 0 rgba(255,240,210,.06),0 10px 30px rgba(0,0,0,.32)}
h1,.hero .who,.sec-h h2,.row .nm{color:var(--cream)}
.game,.hero .lbl,.hero .meta,.hero .atd,.ring .cap,.tile .k,.sec-h p{color:var(--muted)}

.ring .track{stroke:#2a251d}
.ring .bar{stroke:url(#ringGold)}
.ring .big,.hero .at{color:var(--gold-hi)}
.tile .v{color:var(--cream2)}
.tile.live{background:linear-gradient(180deg,#24170f,#17120e);border-color:rgba(240,138,108,.28)}
.tile.live .k{color:var(--coral)}
.tile.live .v{color:var(--cream)}

.pill,.btn,.sw{border-color:rgba(227,178,94,.32);color:var(--gold-hi);background:rgba(227,178,94,.04)}
.btn.primary,.picker{background:linear-gradient(180deg,#ecc276,#d4a252);border-color:transparent;color:#1d1408;box-shadow:0 4px 14px rgba(212,162,82,.22)}
.mode{background:rgba(255,235,200,.04);border-color:var(--line);color:var(--muted)}
.mode.admin{color:var(--gold-hi);border-color:rgba(227,178,94,.32)}
.mode.admin .dot{background:var(--gold)}
.admin-panel{background:linear-gradient(180deg,#201b13,#16130f);border-color:rgba(227,178,94,.2)}
.admin-panel h2{color:var(--gold-hi)}
.field{background:#100e0b;border-color:var(--line)}

.tabs button{color:var(--muted)}
.tabs button[aria-selected="true"]{background:rgba(227,178,94,.16);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(227,178,94,.35)}

.sec-h.respawn .ic{background:rgba(227,178,94,.12);color:var(--gold-hi)}
.sec-h.fixed .ic{background:rgba(255,235,200,.07);color:var(--cream2)}
.sec-h.off .ic{background:rgba(255,235,200,.04);color:var(--faint)}
.sec-off{background:#110f0c;border-color:rgba(255,235,200,.05);box-shadow:none}

.row{border-top-color:var(--line)}
.row .chip{background:rgba(255,235,200,.05);box-shadow:inset 0 0 0 1px rgba(255,235,200,.06)}
.row .chip .hm{color:var(--cream2)}
.row .chip .dy{color:var(--faint)}
.row .sub,.row .tg{color:var(--faint)}
.row .lf{color:#cfc4b0}
.row.soon .chip{background:rgba(227,178,94,.14);box-shadow:inset 0 0 0 1px rgba(227,178,94,.45)}
.row.soon .chip .hm{color:var(--gold-hi)}
.row.soon .chip .dy{color:rgba(240,199,122,.75)}
.row.soon .lf{color:var(--gold-hi)}
.row.live .chip{background:rgba(240,138,108,.14);box-shadow:inset 0 0 0 1px rgba(240,138,108,.45)}
.row.live .chip .hm{color:var(--coral)}
.row.live .chip .dy{color:rgba(240,138,108,.8)}
.row.live .lf{color:var(--coral)}
.row.off{opacity:1}
.row.off .chip{background:rgba(255,235,200,.03);box-shadow:none}
.row.off .chip .hm,.row.off .nm,.row.off .lf{color:#6f685c}
.note{background:rgba(255,235,200,.06);color:#b9ad98;border:1px solid rgba(255,235,200,.06)}
.region-note{background:#110f0c;border-color:var(--line)}

.sw[aria-checked="true"] .knob{background:var(--gold)}
.savebar{background:linear-gradient(180deg,#241f17,#1a1712);border-color:rgba(227,178,94,.28);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast{background:#221d16;border-color:rgba(227,178,94,.22)}
dialog{background:linear-gradient(180deg,#1f1b15,#15130f);border-color:rgba(227,178,94,.2)}
.ask{background:rgba(255,235,200,.05)}
.seg button[aria-pressed="true"]{background:rgba(227,178,94,.14);color:var(--gold-hi)}
footer{color:var(--faint)}
:focus-visible{outline-color:var(--gold-hi)}

/* ---- urgent: 5 minutes or less ---- */
.row.urgent .chip{background:rgba(255,92,80,.16);box-shadow:inset 0 0 0 1px rgba(255,92,80,.55)}
.row.urgent .chip .hm,.row.urgent .chip .dy,.row.urgent .lf,.row.urgent .nm{color:#ff6a5c}
.hero.urgent .ring .bar{stroke:#ff6a5c}
.hero.urgent .ring .big,.hero.urgent .at{color:#ff6a5c}
.hero.urgent{border-color:rgba(255,92,80,.4)}

.res-list{margin-top:10px}
.res-sec{font-weight:700;padding:16px 0 6px;font-size:15px}
.res-sec .hint{font-weight:400;margin-left:6px}
.res-row{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,235,200,.07)}
.res-row .ap{width:18px;height:18px;margin:0}
.res-row .rn{font-size:14px;min-width:0}
.res-row .when{text-align:right;font-size:13px;font-weight:700;color:#f0c77a;white-space:nowrap}
.res-row .inp{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:#9f9584}
.res-row .inp input[type=number]{width:58px;padding:6px 8px}
.res-row .lvl{display:inline-flex;align-items:center;gap:4px;margin-left:6px;white-space:nowrap}

.stale{padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.55;background:rgba(240,138,108,.12);border:1px solid rgba(240,138,108,.4);color:#f3d6cc}
.stale b{color:#f08a6c}
.install .btn{min-height:32px;margin-left:6px;font-size:12px}
.res-row .src{font-size:12px;padding:4px 6px;max-width:150px}
.res-row .tag{font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px}
.res-row .tag.chg{background:rgba(227,178,94,.18);color:#f0c77a}
.res-row .tag.same{background:rgba(255,235,200,.06);color:#857d6f}
.ask ol{margin:8px 0 0;padding-left:20px}
.ask li{margin:2px 0}

.homebtn{min-height:36px;font-size:12.5px}
.guide{font-size:14px;line-height:1.7;margin-top:10px}
.guide ol{padding-left:20px;margin:6px 0}
footer .contact{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,235,200,.07);color:#9f9584}

/* ---- just spawned (up to 5 min): shown at the bottom of its list ---- */
.row.recent .chip{background:rgba(255,235,200,.04);box-shadow:inset 0 0 0 1px rgba(255,235,200,.12)}
.row.recent .chip .hm{color:#b9ad98}
.row.recent .chip .dy{color:#857d6f}
.row.recent .nm{color:#cfc4b0}
.row.recent .lf{color:#e6d9bf}
.row.recent .tg{color:#857d6f}

/* ---- 5-minute spawn alert badge ---- */
.rbadge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;vertical-align:2px;background:rgba(240,138,108,.16);color:#f39a80;box-shadow:inset 0 0 0 1px rgba(240,138,108,.4)}
.row.justspawned .chip{box-shadow:inset 0 0 0 1px rgba(240,138,108,.35)}
.rt-time{font-family:var(--num);font-size:12px;color:#f39a80;margin-left:4px}
/* ---- view counter ---- */
.views{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:14px;background:rgba(255,235,200,.04);border:1px solid rgba(255,235,200,.07);font-size:13.5px}
.views .vk{color:#9f9584}
#viewStats{display:flex;gap:14px;flex-wrap:wrap;color:#cfc4b0}
#viewStats b{color:#f0c77a;font-family:var(--num);font-weight:800;margin-left:3px}

.mt-row{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,235,200,.07)}
.mt-row:first-of-type{border-top:none}
.mt-n{font-size:13px;font-weight:700;margin-bottom:6px}
.mt-row .sp{width:100%}
.mt-row .st{min-width:150px}
.parsed{font-size:13px;margin-top:6px;color:#9f9584}
.parsed.ok{color:#f0c77a;font-weight:700}
.parsed.bad{color:#ff6a5c}

.ver{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#cfc4b0}
.ver .vk{color:#9f9584}
.ver b{color:#f0c77a;font-family:var(--num);font-weight:800}
.ver .vs{color:#9f9584}
.ver .vs.ok{color:#8fd19e}
.ver .vs.new{color:#f39a80;font-weight:700}
.ver .btn{min-height:30px;font-size:12px;padding:0 10px}

@media (max-width:420px){
  .hero{gap:14px;padding:18px 16px}
  .ring{width:112px;height:112px}
  .ring svg{width:112px;height:112px}
  .ring .big{font-size:18px}
}
@media (prefers-reduced-motion:no-preference){
  .row.live .hm{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
/* ---------- 필드 보스 통제 팝업 ---------- */
.toast{z-index:200}
.lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));
  background:rgba(12,4,3,.72);-webkit-backdrop-filter:blur(14px) saturate(70%);backdrop-filter:blur(14px) saturate(70%)}
.lock[hidden]{display:none}
.lock-box{width:min(100%,420px);border-radius:28px;overflow:hidden;text-align:center;
  background:linear-gradient(180deg,#2a0b08,#170504);border:2px solid #ff3b30;
  box-shadow:0 0 0 6px rgba(255,59,48,.16),0 24px 60px rgba(0,0,0,.6)}
.lock-top{background:#ff3b30;color:#fff;padding:12px 16px;font-size:13px;font-weight:900;letter-spacing:.18em;display:flex;align-items:center;justify-content:center;gap:8px}
.lock-body{padding:30px 22px 22px}
.lock-ic{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,59,48,.16);border:2px solid #ff3b30}
.lock-msg{margin:0;font-size:clamp(23px,6.4vw,30px);line-height:1.3;font-weight:900;letter-spacing:-.03em;color:#ff4d42;word-break:keep-all}
.lock-sub{margin:12px auto 0;display:inline-block;padding:6px 16px;border-radius:999px;font-size:15px;font-weight:900;color:#fff;background:rgba(255,59,48,.25);border:1px solid rgba(255,59,48,.6)}
.lock-warn{margin:16px 0 0;font-size:13px;color:#e8b4ae;word-break:keep-all}
.lock-admin{margin-top:22px;background:none;border:none;color:rgba(255,200,195,.55);font-size:12px;text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:0 10px}
.lock-admin[hidden],.lock-exit[hidden]{display:none}
.lock-exit{margin-top:22px}
@media (prefers-reduced-motion:no-preference){
  .lock-box{animation:lockIn .35s ease-out,lockGlow 1.8s ease-in-out .35s infinite}
  @keyframes lockIn{from{transform:scale(.92);opacity:0}}
  @keyframes lockGlow{50%{box-shadow:0 0 0 10px rgba(255,59,48,.08),0 24px 60px rgba(0,0,0,.6)}}
}
.lock-strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;background:#b3140c;color:#fff;font-size:13px;font-weight:700;text-align:center;word-break:keep-all}
.lock-strip[hidden]{display:none}
.lock-card{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;background:rgba(255,235,200,.03);border:1px solid rgba(255,235,200,.07)}
.lock-card.on{background:linear-gradient(180deg,rgba(255,59,48,.14),rgba(255,59,48,.05));border-color:rgba(255,59,48,.45)}
.lock-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lock-title{font-weight:900;font-size:14.5px;color:#ece3d2}
.lock-state{font-size:12.5px;color:#9f9584;margin-top:2px}
.lock-card.on .lock-state{color:#ff8a80;font-weight:700}
.lock-card .lbl-s{font-size:12px;color:#9f9584;display:block;margin-bottom:4px}
.lock-card .field{width:100%}
.lock-card .sw[aria-checked="true"]{border-color:rgba(255,59,48,.6);color:#ff8a80}
.lock-card .sw[aria-checked="true"] .knob{background:#ff3b30}
.lock-card .sw[aria-checked="true"] .knob::after{background:#fff}
.lock-card .hint{margin:0;font-size:12px;color:#9f9584}

/* =========================================================
   길드 메뉴 (보스표 · 공지 · 일정 · 꿀팁)
   ========================================================= */
#app[hidden],.g-view[hidden]{display:none}
#app .wrap,.g-view .wrap{padding-top:10px;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.g-top{position:relative;z-index:35;max-width:720px;margin:0 auto;padding:16px 20px 0}
.g-top-in{display:flex;align-items:center;justify-content:space-between;gap:10px}
.g-top .game{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-top h1{margin:2px 0 0;font-size:clamp(21px,5.8vw,26px);line-height:1.25;font-weight:900;letter-spacing:-.03em;color:var(--cream)}
.g-hr{display:flex;align-items:center;gap:6px;flex:none}
.g-hr .mode{min-height:30px}
.g-ic{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(255,235,200,.04);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0}
.g-ic[aria-expanded="true"]{color:var(--gold-hi);border-color:rgba(227,178,94,.4)}
.g-menu{position:absolute;right:20px;top:calc(100% + 6px);z-index:60;min-width:210px;padding:6px;border-radius:18px;display:flex;flex-direction:column}
.g-menu button{min-height:46px;padding:0 14px;border:none;border-radius:12px;background:transparent;text-align:left;font-size:14px;font-weight:700;color:var(--cream)}
.g-menu button:hover,.g-menu button:focus-visible{background:rgba(255,235,200,.06)}

.gnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:40;width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:rgba(18,16,13,.95);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid rgba(255,235,200,.09)}
@media (min-width:721px){.gnav{bottom:12px;border-radius:22px;border:1px solid rgba(255,235,200,.09);padding:6px}}
.gnav-b{position:relative;min-height:56px;border:none;border-radius:16px;background:transparent;color:var(--faint);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.gnav-b svg{width:22px;height:22px}
.gnav-b[aria-current="page"]{color:var(--gold-hi);background:rgba(227,178,94,.1)}
.gnav-badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#ff453a;color:#fff;font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px #12100d}
.savebar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
@media (min-width:721px){.savebar{bottom:96px}}

/* 통제 팝업은 보스표에서만: 위 제목줄과 아래 메뉴는 가리지 않음 */
.lock{z-index:30;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.lock-warn{word-break:keep-all}
.lock-nav{margin-top:6px;color:rgba(255,220,214,.75)}
.g-soft{margin:0;padding:0 4px;font-size:13px;color:var(--faint)}
.g-soft b{color:var(--gold-hi)}

.g-slot{display:flex;flex-direction:column;gap:14px}
.g-slot:empty{display:none}
.g-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.g-seg{display:inline-flex;padding:3px;border-radius:12px;border:1px solid var(--line)}
.g-seg button{min-height:34px;padding:0 12px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700}
.g-seg button[aria-pressed="true"]{background:rgba(227,178,94,.14);color:var(--gold-hi)}
.g-empty{padding:26px 16px;text-align:center;color:var(--faint);border-radius:22px;border:1px dashed rgba(255,235,200,.12)}
.g-empty b{color:var(--gold-hi)}

.g-latest{border-radius:26px;padding:20px 18px 14px;border:1px solid rgba(227,178,94,.4);background:radial-gradient(420px 200px at 100% 0,rgba(227,178,94,.14),transparent 70%),linear-gradient(170deg,#282116,#17140f);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.g-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:900;letter-spacing:.06em;color:#1d1408;background:var(--gold);border-radius:999px;padding:3px 10px;margin-bottom:10px}
.g-latest h3{margin:0;font-size:20px;font-weight:900;line-height:1.35;letter-spacing:-.02em;word-break:keep-all;color:var(--cream)}
.g-latest .g-body{font-size:15.5px;color:#e3d8c4}
.g-body{margin:8px 0 0;color:#d9cfbd;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.g-meta{margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.g-meta b{color:var(--cream2);font-weight:700}
.g-foot{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.g-like{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(240,138,108,.35);background:transparent;color:#e7a796;font-size:13.5px;font-weight:700}
.g-like[aria-pressed="true"]{background:rgba(240,138,108,.16);color:#ffb39f;border-color:rgba(240,138,108,.6)}
.g-like[aria-pressed="true"] svg{fill:currentColor}
@media (prefers-reduced-motion:no-preference){.g-like svg{transition:transform .15s}.g-like:active svg{transform:scale(1.25)}}
.g-del{min-height:38px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--faint);font-size:12.5px;font-weight:700}
.g-foot .g-del{margin-left:auto}

.g-olds{border-radius:22px;padding:4px 6px}
.g-olds h4{margin:10px 10px 4px;font-size:12.5px;color:var(--muted);font-weight:700}
.g-old{border-top:1px solid var(--line)}
.g-olds h4 + .g-old{border-top:none}
.g-old-h{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 10px;border:none;background:transparent;text-align:left;color:var(--cream)}
.g-old-h .d{flex:none;font-size:12px;color:var(--faint);min-width:42px}
.g-old-h .tt{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-old-h .lk{flex:none;font-size:12px;color:#e7a796}
.g-old-h .cv{flex:none;color:var(--faint)}
@media (prefers-reduced-motion:no-preference){.g-old-h .cv{transition:transform .2s}}
.g-old-h[aria-expanded="true"] .cv{transform:rotate(90deg)}
.g-old-h[aria-expanded="true"] .tt{white-space:normal}
.g-old-b{padding:0 10px 12px}
.g-old-b .g-body{margin:0;font-size:14.5px}

.g-post{border-radius:22px;padding:16px 16px 12px}
.g-post h3{margin:0;font-size:16px;font-weight:900;line-height:1.4;word-break:keep-all;color:var(--cream)}
.g-links{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.g-lnk{display:flex;align-items:center;gap:8px;min-height:40px;padding:8px 12px;border-radius:12px;background:rgba(255,235,200,.04);border:1px solid var(--line);color:var(--gold-hi);text-decoration:none;font-size:13px;font-weight:700;min-width:0}
.g-lnk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.g-form{border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;border:1px solid rgba(227,178,94,.28);background:linear-gradient(180deg,#201b13,#16130f)}
.g-form h3{margin:0;font-size:15px;font-weight:900;color:var(--gold-hi)}
.g-l{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:700}
.g-req{color:var(--coral)}
.g-opt{color:var(--faint);font-weight:500}
.g-in{width:100%;padding:10px 12px;font-size:15px}
textarea.g-in{resize:vertical;min-height:96px;line-height:1.55}
.g-in.bad{border-color:rgba(240,138,108,.75)}

.g-days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.g-day{position:relative;min-height:58px;border-radius:14px;border:1px solid var(--line);background:rgba(255,235,200,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.g-day b{font-size:15px;color:var(--cream2)}
.g-day small{font-size:10.5px;font-weight:700;color:var(--faint);min-height:14px}
.g-day.today small{color:var(--gold)}
.g-day[aria-pressed="true"]{background:linear-gradient(180deg,#ecc276,#d4a252);border-color:transparent}
.g-day[aria-pressed="true"] b,.g-day[aria-pressed="true"] small{color:#1d1408}
.g-day .cnt{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.g-day[aria-pressed="true"] .cnt{background:#1d1408}
.g-daycard{border-radius:24px;padding:6px 16px 8px}
.g-dh{display:flex;align-items:baseline;gap:8px;margin:10px 0 2px}
.g-dh h3{margin:0;font-size:16px;font-weight:900;color:var(--cream)}
.g-dh.wk h3{font-size:14px}
.g-dh span{font-size:12px;font-weight:700;color:var(--gold)}
.g-ev{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.g-evs .g-ev:first-child{border-top:none}
.g-ev .tm{flex:none;min-width:60px;padding:6px;border-radius:12px;text-align:center;font-weight:800;color:var(--cream2);background:rgba(255,235,200,.05);box-shadow:inset 0 0 0 1px rgba(255,235,200,.06)}
.g-ev .tm small{display:block;font-size:10.5px;font-weight:700;color:var(--faint)}
.g-ev .bd{flex:1;min-width:0}
.g-ev .nm{font-weight:700;word-break:keep-all;color:var(--cream)}
.g-ev .ds{font-size:12.5px;color:var(--faint);word-break:keep-all}
.g-ev.off{opacity:.5}
.g-kd{flex:none;font-size:11px;font-weight:900;padding:3px 8px;border-radius:999px}
.g-kd.guild{color:#1d1408;background:var(--gold)}
.g-kd.meet{color:#1d1408;background:#9fc7a8}
.g-kd.etc{color:var(--cream2);background:rgba(255,235,200,.1)}
.g-kd.boss{color:#e7a796;border:1px solid rgba(240,138,108,.4)}
.g-evadm{display:flex;gap:4px;flex:none}
.g-evadm .g-del{min-height:34px;padding:0 9px}
.g-none{margin:0;padding:8px 0 12px;font-size:13.5px;color:var(--faint)}
@media (max-width:420px){.g-ev{flex-wrap:wrap}.g-evadm{width:100%;justify-content:flex-end}}

function parseDays(t){
  t = String(t || "").replace(/요일/g, "");
  if (/매일|everyday/i.test(t)) return [0,1,2,3,4,5,6];
  var out = [];
  for (var i = 0; i < t.length; i++) { var d = DAYCH.indexOf(t[i]); if (d >= 0 && out.indexOf(d) < 0) out.push(d); }
  return out.sort();
}
function parseHours(t){
  return String(t == null ? "" : t).split(/[^0-9]+/).filter(function(x){ return x !== ""; }).map(Number).filter(function(h){ return h >= 0 && h <= 23; });
}

function occ(b, t){
  var out = [], base = kMid(t);
  for (var i = -2; i <= 8; i++) {
    var day = base + i * D, wd = k(day).getUTCDay();
    if (b.days.indexOf(wd) < 0) continue;
    for (var j = 0; j < b.hours.length; j++) out.push(day + b.hours[j] * H + (b.minute || 0) * M);
  }
  return out.sort(function(a, c){ return a - c; });
}
function compute(b, now){
  if (b.type === "fixed") {
    var start = b.startAt || 0, list = occ(b, Math.max(now, start)), last = null, next = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i] < start) continue;
      if (list[i] <= now) last = list[i];
      else if (next === null) next = list[i];
    }
    return {st:"up", at:next, certain:true, pending: now < start, recent: (last !== null && now - last < RECENT) ? last : null};
  }
  if (!b.anchor) return {st:"unknown", why:"시간 미등록"};
  if (now < b.anchor) return {st:"up", at:b.anchor, certain:true};
  var iv = b.interval ? b.interval * M + killMs(b) : 0;
  if (!iv) {
    return {st:"unknown", why:"리젠 주기 미정", recent: now - b.anchor < RECENT ? b.anchor : null};
  }
  var n = Math.floor((now - b.anchor) / iv), lastR = b.anchor + n * iv;
  return {st:"up", at:lastR + iv, certain:false, recent: now - lastR < RECENT ? lastR : null};
}
function recentText(c, now){
  if (!c.recent) return "";
  var ago = Math.floor((now - c.recent) / M);
  return (ago < 1 ? "방금" : ago + "분 전") + " 출현";
}
function texts(b, c, now){
  if (c.st === "live") return {hm:"출현", dy: c.aliveSeen ? "스샷 확인" : hm(c.since), lf:"출현 중", tg: c.aliveSeen ? "처치 시각 미기록" : since(now - c.since)};
  if (c.st === "recent") {
    var ago = Math.floor((now - c.since) / M);
    return {hm:hm(c.since), dy:"출현", lf:(ago < 1 ? "방금" : ago + "분 전") + " 출현", tg: c.next ? "다음 " + dayLabel(c.next, now) + " " + hm(c.next) + (b.type === "fixed" ? "" : " 예상") : (b.type === "fixed" ? fixedLabel(b) : cycLabel(b))};
  }
  if (c.st === "up") return {hm:hm(c.at), dy:dayLabel(c.at, now), lf:left(c.at - now) + " 후", tg: b.type === "fixed" ? fixedLabel(b) + (c.pending ? " · 10/14부터" : "") : cycLabel(b)};
  return {hm:"—", dy:"미정", lf:c.why, tg: b.type === "fixed" ? fixedLabel(b) : cycLabel(b)};
}
var SOON = 60 * M;
function isSoon(b, c, now){ return b.enabled && c.st === "up" && c.at - now <= SOON; }
function isUrgent(b, c, now){ return b.enabled && c.st === "up" && c.at - now <= URGENT; }

function sortKey(x){ return x.c.st === "live" ? -1 : x.c.st === "up" ? x.c.at : x.c.st === "recent" ? 9e15 + x.c.since : Infinity; }
function snapshot(now){

}
function signature(items, now){
  return items.map(function(x){ return x.b.id + x.c.st + (x.c.at || "") + isSoon(x.b, x.c, now) + isUrgent(x.b, x.c, now) + (x.c.recent ? "r" : ""); }).join("|") + tab + admin;
}

function heroData(items, now){
  var on = items.filter(function(x){ return x.b.enabled && x.c.st === "up"; }).sort(function(a, c){ return a.c.at - c.c.at; });
  if (!on.length) return null;
  var nx = on[0], same = on.filter(function(x){ return x.c.at === nx.c.at; });
  var win = nx.b.type === "respawn" && nx.b.interval ? nx.b.interval * M : 12 * H;
  var p = Math.max(0, Math.min(1, 1 - (nx.c.at - now) / win));
  return {x:nx, names: same.map(function(s){ return s.b.name; }).join(", "), p:p};
}
var RC = 2 * Math.PI * 58;

var lockEl = document.getElementById("lock"), lockStrip = document.getElementById("lockStrip");
function savedLock(){
  try { var s = migrate(JSON.parse(saved)).lockdown; if (s) return s; } catch (e) {}
  return { on: true, main: LOCK_MAIN, sub: LOCK_SUB };
}
function renderLock(){
  // 길드원: 저장된 설정 기준 / 관리자: 미리보기일 때만 (저장 전 문구로)
  var L = admin ? state.lockdown : savedLock();
  var onBoss = (gView || "boss") === "boss";
  if (!admin || !onBoss) lockPreview = false;
  var show = (admin ? lockPreview : L.on) && onBoss;
  var m = document.getElementById("lockMsg"), s = document.getElementById("lockSub");
  var mt = (L.main || "").trim() || LOCK_MAIN, st = (L.sub || "").trim() || LOCK_SUB;
  if (m.textContent !== mt) m.textContent = mt;
  if (s.textContent !== st) s.textContent = st;

  document.getElementById("lockAdmin").hidden = admin;
  document.getElementById("lockExit").hidden = !(admin && lockPreview);
  if ("inert" in app) app.inert = show;
  app.setAttribute("aria-hidden", show ? "true" : "false");
  bar.style.visibility = show ? "hidden" : "";

}
lockEl.addEventListener("click", function(e){
  if (e.target.closest("#lockAdmin")) return loginDlg();
  if (e.target.closest("#lockExit")) { lockPreview = false; renderLock(); }
});

function editing(){
  var a = document.activeElement;
  return a && (a.tagName === "INPUT" || a.tagName === "SELECT" || a.tagName === "TEXTAREA") && app.contains(a);
}
function tick(){
  var now = nowT(), items = snapshot(now);
  if (signature(items, now) !== lastSig && !editing() && !dlg.open) { render(); return; }
  var nk = k(now), c = document.getElementById("clk");
  if (c) c.textContent = hm(now) + ":" + pad(nk.getUTCSeconds());
  items.forEach(function(x){
    var el = app.querySelector('[data-row="' + x.b.id + '"]'); if (!el) return;
    var t = texts(x.b, x.c, now);
    el.querySelector('[data-f="lf"]').textContent = t.lf;
    el.querySelector('[data-f="tg"]').textContent = t.tg;
    var rb = el.querySelector('[data-f="rb"]'); if (rb) rb.textContent = recentText(x.c, now);
  });
  var hd = heroData(items, now), hl = document.getElementById("heroLeft"), rb = document.getElementById("ringBar");
  if (hd && hl) { hl.textContent = clockLeft(hd.x.c.at - now); rb.setAttribute("stroke-dashoffset", (RC * (1 - hd.p)).toFixed(1)); }
}

function parseDateText(t, fallback){
  t = String(t || "").trim();

  if ((m = t.match(/(20\d{2})(\d{2})(\d{2})[_\-T ]?(\d{2})(\d{2})(\d{2})?/))) {
    y = +m[1]; mo = +m[2]; d = +m[3]; h = +m[4]; mi = +m[5]; se = +(m[6] || 0);
  } else {
    if ((m = t.match(/(\d{4})\s*년\s*(\d{1,2})\s*월\s*(\d{1,2})\s*일/)) || (m = t.match(/(\d{4})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})/))) { y = +m[1]; mo = +m[2]; d = +m[3]; }
    var tm = t.match(/(오전|오후|AM|PM|am|pm)?\s*(\d{1,2})\s*[:시]\s*(\d{1,2})\s*(?:[:분]\s*(\d{1,2}))?/);
    if (tm && !(y && tm.index < (m ? m.index + m[0].length : 0))) {
      h = +tm[2]; mi = +tm[3]; se = +(tm[4] || 0);
      var ap = (tm[1] || "").toLowerCase();
      if ((ap === "오후" || ap === "pm") && h < 12) h += 12;
      if ((ap === "오전" || ap === "am") && h === 12) h = 0;
    }
    if (!y && fallback != null) { var f = k(fallback); y = f.getUTCFullYear(); mo = f.getUTCMonth() + 1; d = f.getUTCDate(); }
  }
  if (!y || h === null || mo < 1 || mo > 12 || d < 1 || d > 31 || h > 23 || mi > 59 || se > 59) return null;
  return Date.UTC(y, mo - 1, d, h, mi, se) - KST;
}

var gEntry = (function(){ var x = (location.hash || "").replace("#", ""); return V_ORDER[x] ? x : "boss"; })();
var gView = gEntry, gMenuOpen = false;
var gTop = document.getElementById("gTop"), gNav = document.getElementById("gNav");
var gViewEl = { notice: document.getElementById("vNotice"), schedule: document.getElementById("vSched"), tips: document.getElementById("vTips") };

function gGet(key, d){ try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? d : v; } catch (e) { return d; } }
function gSet(key, v){ try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function gStamp(ms){ var d = k(ms); return d.getUTCFullYear() + "년 " + (d.getUTCMonth() + 1) + "월 " + d.getUTCDate() + "일 " + pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes()) + ":" + pad(d.getUTCSeconds()); }
function gMD(ms){ var d = k(ms); return (d.getUTCMonth() + 1) + "/" + d.getUTCDate(); }
function gAgo(ms){ var s = Math.floor((nowT() - ms) / 1000); if (s < 60) return "방금"; if (s < 3600) return Math.floor(s / 60) + "분 전"; if (s < 86400) return Math.floor(s / 3600) + "시간 전"; if (s < 86400 * 30) return Math.floor(s / 86400) + "일 전"; return gMD(ms); }
function gSafeUrl(u){ return /^https?:\/\/[^\s"'<>]+\.[^\s"'<>]+$/i.test(String(u || "").trim()); }
function gTodayMon(){ return (k(nowT()).getUTCDay() + 6) % 7; } // 0=월 … 6=일
var G_DAYS = ["월", "화", "수", "목", "금", "토", "일"];

/* ---------- 데이터 ---------- */
var gNotices = [], gTips = [], gSched = { intro: "", events: [] };
var gLoaded = { notice: !LIVE, tips: !LIVE, schedule: !LIVE }, gErr = {};
var gLiked = gGet("guild-likes", {}), gLikeBusy = {};
var gSeen = gGet("guild-seen", null);
if (!gSeen || typeof gSeen !== "object") { gSeen = { notice: nowT() - 7 * D, tips: nowT() - 7 * D }; gSet("guild-seen", gSeen); }
var G_INTRO = "처음 오신 분 환영해요! 우리 길드가 한 주 동안 어떻게 움직이는지 아래에서 확인해 주세요.";
var gDb = LIVE ? firebase.firestore() : null;
var G_KINDS = { guild: "길드 활동", meet: "모임 · 정산", etc: "기타" };

function gRows(snap){
  return snap.docs.map(function(d){
    var x = d.data({ serverTimestamps: "estimate" }) || {}, ts = x.createdAt;
    return { id: d.id, title: String(x.title || ""), body: String(x.body || ""), author: String(x.author || ""),
      links: Array.isArray(x.links) ? x.links.filter(gSafeUrl).slice(0, 3) : [],
      likes: Math.max(0, +x.likes || 0), at: ts && ts.toMillis ? ts.toMillis() : nowT() };
  });
}
function gOkEvent(e){ return e && typeof e.title === "string" && /^\d{2}:\d{2}$/.test(e.time) && Array.isArray(e.days); }
function gOnData(kind){ if (gView === kind) { gMarkSeen(); gRenderView(true); } gRenderNav(); }
if (LIVE) {
  gDb.collection("notices").orderBy("createdAt", "desc").limit(50).onSnapshot(function(s){
    gNotices = gRows(s); gLoaded.notice = true; delete gErr.notice; gOnData("notice");
  }, function(e){ gLoaded.notice = true; gErr.notice = (e && e.code) || "error"; gOnData("notice"); });
  gDb.collection("tips").orderBy("createdAt", "desc").limit(100).onSnapshot(function(s){
    gTips = gRows(s); gLoaded.tips = true; delete gErr.tips; gOnData("tips");
  }, function(e){ gLoaded.tips = true; gErr.tips = (e && e.code) || "error"; gOnData("tips"); });
  gDb.collection("guild").doc("schedule").onSnapshot(function(s){
    var x = s.exists ? s.data() : {};
    gSched = { intro: typeof x.intro === "string" ? x.intro : "", events: Array.isArray(x.events) ? x.events.filter(gOkEvent) : [] };
    gLoaded.schedule = true; delete gErr.schedule; gOnData("schedule");
  }, function(e){ gLoaded.schedule = true; gErr.schedule = (e && e.code) || "error"; gOnData("schedule"); });
}
function gErrMsg(e){
  var c = e && e.code;
  if (c === "permission-denied") return "권한이 없어 저장하지 못했어요." + (admin ? "" : " 관리자 로그인이 필요한 기능일 수 있어요.");
  if (c === "unavailable") return "서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.";
  return "저장하지 못했어요. 잠시 후 다시 시도해 주세요.";
}
function gCountNew(list, since){ var c = 0; list.forEach(function(p){ if (p.at > since) c++; }); return c; }
function gMarkSeen(){
  var list = gView === "notice" ? gNotices : gView === "tips" ? gTips : null;
  if (!list || !gLoaded[gView]) return;
  var top = nowT(); list.forEach(function(p){ if (p.at > top) top = p.at; });
  if (gSeen[gView] !== top) { gSeen[gView] = top; gSet("guild-seen", gSeen); }
}

/* ---------- 상단 · 하단 메뉴 ---------- */
var gLastAdmin = null;
function gRenderShell(){ gRenderTop(); gRenderNav(); }
function gRenderTop(){
  var h = '<div class="g-top-in"><div style="min-width:0"><div class="game">제우스: 오만의신 · 포세이돈2 · 의정부시 길드</div><h1>' + V_TITLE[gView] + '</h1></div><div class="g-hr">';
  if (admin) h += '<span class="mode admin" role="status"><span class="dot"></span>관리자</span>';
  h += '<button class="g-ic" data-g="copy" aria-label="지금 메뉴 링크 복사" title="지금 메뉴 링크 복사">' + G_IC_LINK + '</button>';
  h += '<button class="g-ic" data-g="menu" aria-label="더보기" aria-haspopup="true" aria-expanded="' + gMenuOpen + '">' + G_IC_MORE + '</button></div></div>';
  if (gMenuOpen) {
    h += '<div class="g-menu glass" role="menu">' +
      (admin ? '<button role="menuitem" data-act="logout">로그아웃</button>' : '<button role="menuitem" data-act="login">관리자 로그인</button>') +
      (isStandalone() ? '' : '<button role="menuitem" data-act="install">홈 화면에 추가</button>') +
      '<button role="menuitem" data-g="copy">지금 메뉴 링크 복사</button></div>';
  }
  gTop.innerHTML = h;
  if (gLastAdmin !== admin) { gLastAdmin = admin; if (gView !== "boss") gRenderView(); }
}
function gRenderNav(){
  var nb = { notice: gCountNew(gNotices, gSeen.notice), tips: gCountNew(gTips, gSeen.tips) };
  gNav.innerHTML = V_ORDER[gEntry].map(function(v){
    var c = v === gView ? 0 : (nb[v] || 0);
    return '<button class="gnav-b" data-view="' + v + '"' + (v === gView ? ' aria-current="page"' : '') + '>' + V_IC[v] + '<span>' + V_SHORT[v] + '</span>' +
      (c ? '<span class="gnav-badge num" aria-label="새 글 ' + c + '개">' + (c > 9 ? "9+" : c) + '</span>' : '') + '</button>';
  }).join("");
}
function gSetView(v){
  if (!V_ORDER[v]) return;
  gView = v; gMenuOpen = false;
  app.hidden = v !== "boss";
  Object.keys(gViewEl).forEach(function(key){ gViewEl[key].hidden = key !== v; });
  gMarkSeen();
  if (v === "boss") render(); else { gRenderShell(); gRenderView(); renderLock(); }
  window.scrollTo(0, 0);
}
function gCopyLink(){
  var u = location.origin + location.pathname + "#" + gView;
  var ok = function(){ toast(V_SHORT[gView] + " 링크를 복사했어요.", "ok"); };
  var fallback = function(){ window.prompt("아래 링크를 복사하세요", u); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(ok, fallback); else fallback();
}
gTop.addEventListener("click", function(e){
  var g = e.target.closest("[data-g]");
  if (g && g.getAttribute("data-g") === "menu") { gMenuOpen = !gMenuOpen; gRenderTop(); if (gMenuOpen) { var f = gTop.querySelector(".g-menu button"); if (f) f.focus(); } return; }
  if (g && g.getAttribute("data-g") === "copy") { gMenuOpen = false; gRenderTop(); gCopyLink(); return; }
  if (e.target.closest("[data-act]")) { gMenuOpen = false; gRenderTop(); onClick(e); }
});
document.addEventListener("click", function(e){
  if (gMenuOpen && !e.target.closest(".g-menu") && !e.target.closest('[data-g="menu"]')) { gMenuOpen = false; gRenderTop(); }
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && gMenuOpen) { gMenuOpen = false; gRenderTop(); var b = gTop.querySelector('[data-g="menu"]'); if (b) b.focus(); }
});
gNav.addEventListener("click", function(e){ var b = e.target.closest("[data-view]"); if (b) gSetView(b.getAttribute("data-view")); });

/* ---------- 각 메뉴 화면 ---------- */
var gForms = { notice: null, tips: null, schedule: null };
var gOpenOld = {}, gTipSort = "new", gSDay = gTodayMon(), gSWeek = false, gShowBoss = true, gIntroEdit = null;

function gRenderView(listOnly){
  var el = gViewEl[gView]; if (!el) return;
  if (!admin) { gForms.notice = null; if (gForms.schedule) gForms.schedule = null; gIntroEdit = null; }
  if (!el.firstChild) el.innerHTML = '<div class="wrap"><div class="g-slot" data-slot="head"></div><div class="g-slot" data-slot="form"></div><div class="g-slot" data-slot="list"></div></div>';
  var slot = function(n){ return el.querySelector('[data-slot="' + n + '"]'); };
  var fn = gView === "notice" ? [gNoticeHead, gNoticeForm, gNoticeList] : gView === "tips" ? [gTipsHead, gTipsForm, gTipsList] : [gSchedHead, gSchedForm, gSchedList];
  slot("head").innerHTML = fn[0]();
  if (!listOnly) slot("form").innerHTML = fn[1]();
  slot("list").innerHTML = fn[2]();
}
function gRenderForm(){ var el = gViewEl[gView]; if (!el || !el.firstChild) return gRenderView(); var s = el.querySelector('[data-slot="form"]'); s.innerHTML = gView === "notice" ? gNoticeForm() : gView === "tips" ? gTipsForm() : gSchedForm(); }
function gStatus(kind, emptyMsg, list){
  if (!gLoaded[kind]) return '<div class="g-empty">불러오는 중…</div>';
  if (gErr[kind]) return '<div class="g-empty">글을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</div>';
  if (list && !list.length) return '<div class="g-empty">' + emptyMsg + '</div>';
  return "";
}
function gLikeBtn(kind, p){
  var on = !!gLiked[kind + ":" + p.id];
  return '<button class="g-like" data-g="like" data-k="' + kind + '" data-id="' + esc(p.id) + '" aria-pressed="' + on + '" aria-label="좋아요 ' + p.likes + '개' + (on ? ', 내가 누름' : '') + '">' + G_IC_HEART + '<span class="num">' + p.likes + '</span></button>';
}
function gDelBtn(kind, id){ return admin ? '<button class="g-del" data-g="del" data-k="' + kind + '" data-id="' + esc(id) + '">삭제</button>' : ''; }
function gField(kind, f, label, req, tag, attrs, val, err){
  var id = "gf-" + kind + "-" + f;
  var input = tag === "textarea"
    ? '<textarea class="field g-in' + (err ? ' bad' : '') + '" id="' + id + '" data-gf="' + f + '" data-k="' + kind + '" ' + attrs + '>' + esc(val) + '</textarea>'
    : '<input class="field g-in' + (err ? ' bad' : '') + '" id="' + id + '" data-gf="' + f + '" data-k="' + kind + '" ' + attrs + ' value="' + esc(val) + '">';
  return '<div><label class="g-l" for="' + id + '">' + label + (req ? ' <span class="g-req">*</span>' : ' <span class="g-opt">(선택)</span>') + '</label>' + input + '<div class="g-err" id="' + id + '-err">' + (err || '') + '</div></div>';
}
function gActs(kind, okLabel, busy){
  return '<div class="g-acts"><button class="btn" data-g="cancel" data-k="' + kind + '">취소하기</button><button class="btn primary" data-g="submit" data-k="' + kind + '"' + (busy ? ' disabled' : '') + '>' + (busy ? '저장 중…' : okLabel) + '</button></div>';
}

/* 공지 */
function gNoticeHead(){ return admin && !gForms.notice ? '<div class="g-bar"><span></span><button class="btn primary" data-g="write" data-k="notice">+ 공지 작성</button></div>' : ''; }
function gNoticeForm(){
  var d = gForms.notice; if (!d) return '';
  return '<section class="g-form" aria-label="공지 작성"><h3>새 공지 작성</h3>' +
    gField("notice", "title", "제목", true, "input", 'maxlength="60"', d.title, d.errs.title) +
    gField("notice", "body", "내용", true, "textarea", 'maxlength="3000" rows="6"', d.body, d.errs.body) +

}
function gNoticeList(){
  var st = gStatus("notice", "아직 공지가 없어요.", gNotices); if (st) return st;
  var p = gNotices[0], h = '';
  h += '<article class="g-latest"><span class="g-tag">📌 최신 공지</span><h3>' + esc(p.title) + '</h3><p class="g-body">' + esc(p.body) + '</p>' +
    '<div class="g-meta"><span>공지 <b class="num">' + gStamp(p.at) + '</b></span><span>작성자 <b>' + esc(p.author) + '</b></span></div>' +
    '<div class="g-foot">' + gLikeBtn("n", p) + gDelBtn("n", p.id) + '</div></article>';
  if (gNotices.length > 1) {
    h += '<section class="g-olds glass"><h4>이전 공지 ' + (gNotices.length - 1) + '개</h4>';
    gNotices.slice(1).forEach(function(q){
      var o = !!gOpenOld[q.id];
      h += '<div class="g-old"><button class="g-old-h" data-g="old" data-id="' + esc(q.id) + '" aria-expanded="' + o + '"><span class="d num">' + gMD(q.at) + '</span><span class="tt">' + esc(q.title) + '</span><span class="lk num" aria-label="좋아요 ' + q.likes + '개">♥ ' + q.likes + '</span><span class="cv" aria-hidden="true">›</span></button>';
      if (o) h += '<div class="g-old-b"><p class="g-body">' + esc(q.body) + '</p><div class="g-meta"><span>공지 <b class="num">' + gStamp(q.at) + '</b></span><span>작성자 <b>' + esc(q.author) + '</b></span></div><div class="g-foot">' + gLikeBtn("n", q) + gDelBtn("n", q.id) + '</div></div>';
      h += '</div>';
    });
    h += '</section>';
  }
  return h;

function gTipsList(){
  var st = gStatus("tips", "첫 꿀팁을 남겨 주세요!", gTips); if (st) return st;
  var list = gTips.slice().sort(function(a, b){ return gTipSort === "like" ? (b.likes - a.likes) || (b.at - a.at) : b.at - a.at; });
  return list.map(function(p){

    if (p.links.length) h += '<div class="g-links">' + p.links.map(function(u){ return '<a class="g-lnk" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer nofollow">' + G_IC_URL + '<span>' + esc(u.replace(/^https?:\/\//i, "")) + '</span></a>'; }).join("") + '</div>';
    return h + '<div class="g-meta"><span>작성자 <b>' + esc(p.author) + '</b></span><span class="num">' + gStamp(p.at) + '</span><span>' + gAgo(p.at) + '</span></div><div class="g-foot">' + gLikeBtn("t", p) + gDelBtn("t", p.id) + '</div></article>';
  }).join("");

/* 일정 */
function gBossOn(dayIdx){
  var out = [], now = nowT(), src = state.bosses || [];
  src.forEach(function(b){
    if (b.type !== "fixed" || !Array.isArray(b.days) || !Array.isArray(b.hours) || !b.hours.length) return;
    if (!b.days.some(function(d){ return (d + 6) % 7 === dayIdx; })) return;
    var later = b.startAt && b.startAt > now, on = b.enabled && !later, desc;
    if (!b.enabled) desc = b.note || "진행하지 않음";
    else if (later) desc = gMD(b.startAt) + "부터 출현";
    else desc = (b.lv ? "Lv." + b.lv + " · " : "") + (b.loc || "");
    var times = b.hours.slice().sort(function(a, c){ return a - c; }).map(function(hh){ return pad(hh) + ":" + pad(b.minute || 0); });
    if (times.length > 1) desc = b.hours.join(" · ") + "시 · " + desc;
    out.push({ boss: true, on: on, title: b.name, time: times[0], n: times.length, desc: desc });
  });
  return out;
}
function gEventsOn(dayIdx){
  var list = gSched.events.filter(function(e){ return e.days.indexOf(dayIdx) >= 0; }).map(function(e){ return { e: e, time: e.time }; });
  if (gShowBoss) list = list.concat(gBossOn(dayIdx));
  return list.sort(function(a, b){ return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
}
function gEvRow(x){
  if (x.boss) return '<div class="g-ev' + (x.on ? '' : ' off') + '"><div class="tm num">' + (x.n > 1 ? '<small>하루</small>' + x.n + '회' : x.time) + '</div><div class="bd"><div class="nm">' + esc(x.title) + '</div><div class="ds">' + esc(x.desc) + '</div></div><span class="g-kd boss">보스</span></div>';
  var e = x.e, kd = G_KINDS[e.kind] ? e.kind : "etc";
  return '<div class="g-ev"><div class="tm num">' + esc(e.time) + '</div><div class="bd"><div class="nm">' + esc(e.title) + '</div>' + (e.desc ? '<div class="ds">' + esc(e.desc) + '</div>' : '') + '</div><span class="g-kd ' + kd + '">' + G_KINDS[kd] + '</span>' +
    (admin ? '<span class="g-evadm"><button class="g-del" data-g="evedit" data-id="' + esc(e.id) + '">수정</button><button class="g-del" data-g="evdel" data-id="' + esc(e.id) + '">삭제</button></span>' : '') + '</div>';
}
function gSchedHead(){
  var intro = (gSched.intro || "").trim() || G_INTRO;
  var h = '<section class="g-intro"><div class="k">우리 길드는 이렇게 움직여요</div><p>' + esc(intro) + '</p>' +
    (admin && gIntroEdit === null && !gForms.schedule ? '<button class="btn" data-g="introedit" style="margin-top:10px">소개 문구 수정</button>' : '') + '</section>';
  h += '<div class="g-bar"><div class="g-seg" role="group" aria-label="보기"><button data-g="sweek" data-v="0" aria-pressed="' + !gSWeek + '">요일별</button><button data-g="sweek" data-v="1" aria-pressed="' + gSWeek + '">한 주 전체</button></div>' +
    '<label class="g-chk"><input type="checkbox" data-g="showboss"' + (gShowBoss ? ' checked' : '') + '>고정 보스 같이 보기</label>' +
    (admin && !gForms.schedule && gIntroEdit === null ? '<button class="btn primary" data-g="write" data-k="schedule">+ 일정 추가</button>' : '') + '</div>';
  return h;
}
function gSchedForm(){
  if (gIntroEdit !== null) {
    return '<section class="g-form" aria-label="소개 문구 수정"><h3>소개 문구 수정</h3><div><label class="g-l" for="gf-intro">신규 길드원에게 보여줄 소개</label><textarea class="field g-in" id="gf-intro" maxlength="500" rows="4">' + esc(gIntroEdit) + '</textarea></div>' +
      '<div class="g-acts"><button class="btn" data-g="introcancel">취소하기</button><button class="btn primary" data-g="introsave">저장하기</button></div></section>';
  }
  var d = gForms.schedule; if (!d) return '';
  var h = '<section class="g-form" aria-label="일정 ' + (d.id ? '수정' : '추가') + '"><h3>' + (d.id ? '일정 수정' : '일정 추가') + '</h3>';
  h += '<div><span class="g-l">요일 <span class="g-req">*</span> <span class="g-opt">(여러 개 선택 가능)</span></span><div class="g-pick" role="group" aria-label="요일">' + G_DAYS.map(function(n, i){ return '<button data-g="pick" data-i="' + i + '" aria-pressed="' + (d.days.indexOf(i) >= 0) + '">' + n + '</button>'; }).join('') + '</div><div class="g-err">' + (d.errs.days || '') + '</div></div>';
  h += gField("schedule", "time", "시작 시각", true, "input", 'type="time" style="max-width:170px"', d.time, d.errs.time);
  h += gField("schedule", "title", "일정 이름", true, "input", 'maxlength="30" placeholder="예: 길드 정기 사냥"', d.title, d.errs.title);
  h += gField("schedule", "desc", "설명", false, "input", 'maxlength="60" placeholder="예: 디스코드에서 파티 모집"', d.desc, "");
  h += '<div><span class="g-l">종류</span><div class="g-pick" role="group" aria-label="종류">' + Object.keys(G_KINDS).map(function(kk){ return '<button data-g="kind" data-v="' + kk + '" aria-pressed="' + (d.kind === kk) + '">' + G_KINDS[kk] + '</button>'; }).join('') + '</div></div>';
  return h + gActs("schedule", d.id ? "수정하기" : "등록하기", d.busy) + '</section>';
}
function gSchedList(){
  if (!gLoaded.schedule) return '<div class="g-empty">불러오는 중…</div>';
  var t = gTodayMon(), h = '';
  if (gShowBoss && savedLock().on) h += '<div class="g-lockline">⛔ 지금은 모든 필드 보스 통제 중이에요. 보스 일정은 참고만 해 주세요.</div>';
  if (!gSched.events.length) h += '<p class="g-soft">아직 등록된 길드 일정이 없어요.' + (admin ? ' 위의 <b>+ 일정 추가</b>로 넣어 주세요.' : '') + '</p>';
  if (!gSWeek) {
    h += '<div class="g-days" role="group" aria-label="요일 선택">' + G_DAYS.map(function(d, i){
      return '<button class="g-day' + (i === t ? ' today' : '') + '" data-g="sday" data-i="' + i + '" aria-pressed="' + (i === gSDay) + '" aria-label="' + d + '요일' + (i === t ? ', 오늘' : '') + '">' + (gEventsOn(i).length ? '<span class="cnt"></span>' : '') + '<b>' + d + '</b><small>' + (i === t ? '오늘' : '') + '</small></button>';
    }).join('') + '</div>';
    var list = gEventsOn(gSDay);
    h += '<section class="g-daycard glass"><div class="g-dh"><h3>' + G_DAYS[gSDay] + '요일</h3>' + (gSDay === t ? '<span>오늘</span>' : '') + '</div><div class="g-evs">' + (list.length ? list.map(gEvRow).join('') : '<p class="g-none">이 날은 정해진 일정이 없어요.</p>') + '</div></section>';
  } else {
    h += '<section class="g-daycard glass">' + G_DAYS.map(function(d, i){
      var list = gEventsOn(i);
      return '<div class="g-dh wk"><h3>' + d + '요일</h3>' + (i === t ? '<span>오늘</span>' : '') + '</div><div class="g-evs">' + (list.length ? list.map(gEvRow).join('') : '<p class="g-none">일정 없음</p>') + '</div>';
    }).join('') + '</section>';
  }
  return h;
}

/* ---------- 저장 ---------- */
function gAdd(col, data){
  if (!LIVE) {
    var row = { id: col.charAt(0) + Date.now(), title: data.title, body: data.body, author: data.author, links: data.links || [], likes: 0, at: nowT() };
    (col === "notices" ? gNotices : gTips).unshift(row); gOnData(col === "notices" ? "notice" : "tips");
    return Promise.resolve();
  }
  data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
  return gDb.collection(col).add(data);
}
function gRemove(col, id){
  if (!LIVE) {
    if (col === "notices") gNotices = gNotices.filter(function(x){ return x.id !== id; }); else gTips = gTips.filter(function(x){ return x.id !== id; });
    gOnData(col === "notices" ? "notice" : "tips"); return Promise.resolve();
  }
  return gDb.collection(col).doc(id).delete();
}
function gSaveSched(next, msg){
  var clean = { intro: String(next.intro || ""), events: next.events.map(function(e){ return { id: e.id, days: e.days.slice().sort(), time: e.time, title: e.title, desc: e.desc || "", kind: G_KINDS[e.kind] ? e.kind : "etc" }; }) };
  var p = LIVE
    ? gDb.collection("guild").doc("schedule").set({ intro: clean.intro, events: clean.events, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
    : Promise.resolve().then(function(){ gSched = clean; });
  return p.then(function(){ toast(msg, "ok"); }, function(e){ toast(gErrMsg(e), "bad"); throw e; });
}
function gFocusBad(){ var f = gViewEl[gView] && gViewEl[gView].querySelector(".field.bad"); if (f) f.focus(); }
function gSubmit(kind){
  var d = gForms[kind]; if (!d || d.busy) return;
  d.errs = {};
  if (kind === "schedule") {
    if (!d.days.length) d.errs.days = "요일을 하나 이상 골라 주세요.";
    if (!/^\d{2}:\d{2}$/.test(d.time)) d.errs.time = "시작 시각을 입력해 주세요.";
    if (!d.title.trim()) d.errs.title = "일정 이름을 입력해 주세요.";
    if (Object.keys(d.errs).length) { gRenderForm(); gFocusBad(); return; }
    var ev = { id: d.id || "e" + Date.now().toString(36), days: d.days, time: d.time, title: d.title.trim(), desc: d.desc.trim(), kind: d.kind };
    var events = d.id ? gSched.events.map(function(x){ return x.id === d.id ? ev : x; }) : gSched.events.concat([ev]);
    d.busy = true; gRenderForm();
    gSaveSched({ intro: gSched.intro, events: events }, d.id ? "일정을 수정했어요." : "일정을 추가했어요.").then(function(){
      gForms.schedule = null; gSDay = ev.days[0]; gRenderView();
    }, function(){ d.busy = false; gRenderForm(); });
    return;
  }
  if (!d.title.trim()) d.errs.title = "제목을 입력해 주세요.";
  if (!d.body.trim()) d.errs.body = "내용을 입력해 주세요.";
  if (!d.author.trim()) d.errs.author = "작성자를 꼭 입력해 주세요.";
  var links = [];
  if (kind === "tips") d.links.forEach(function(u, i){
    u = u.trim(); if (!u) return;
    if (!gSafeUrl(u)) { d.errs["link" + i] = 1; d.errs.link = "링크는 http:// 또는 https:// 로 시작하는 주소만 넣을 수 있어요."; } else links.push(u);
  });
  if (Object.keys(d.errs).length) { gRenderForm(); gFocusBad(); return; }
  if (kind === "tips") {
    var last = gGet("guild-lastpost", 0), wait = Math.ceil((last + 30000 - Date.now()) / 1000);
    if (wait > 0) { toast(wait + "초 뒤에 다시 등록할 수 있어요.", "bad"); return; }
  }
  var data = { title: d.title.trim(), body: d.body.trim(), author: d.author.trim(), likes: 0 };
  if (kind === "tips") data.links = links;
  d.busy = true; gRenderForm();
  gAdd(kind === "notice" ? "notices" : "tips", data).then(function(){
    gSet("guild-author", data.author);
    if (kind === "tips") { gSet("guild-lastpost", Date.now()); gTipSort = "new"; }
    gForms[kind] = null; gRenderView();
    toast(kind === "notice" ? "공지했어요. 모든 길드원에게 바로 보여요." : "꿀팁을 등록했어요. 고마워요!", "ok");
  }, function(e){ d.busy = false; gRenderForm(); toast(gErrMsg(e), "bad"); });
}
function gToggleLike(kind, id){
  var key = kind + ":" + id; if (gLikeBusy[key]) return;
  var list = kind === "n" ? gNotices : gTips, p = null;
  list.forEach(function(x){ if (x.id === id) p = x; }); if (!p) return;
  var dlt = gLiked[key] ? -1 : 1;
  if (dlt < 0 && p.likes <= 0) { delete gLiked[key]; gSet("guild-likes", gLiked); gRenderView(true); return; }
  var flip = function(sign){ p.likes += sign * dlt; if ((sign > 0) === (dlt > 0)) gLiked[key] = 1; else delete gLiked[key]; gSet("guild-likes", gLiked); };
  flip(1); gLikeBusy[key] = true; gRenderView(true); gRefocus('[data-g="like"][data-k="' + kind + '"][data-id="' + id + '"]');
  if (!LIVE) { delete gLikeBusy[key]; return; }
  gDb.collection(kind === "n" ? "notices" : "tips").doc(id).update({ likes: firebase.firestore.FieldValue.increment(dlt) }).then(function(){ delete gLikeBusy[key]; }, function(){
    delete gLikeBusy[key]; flip(-1); gRenderView(true); toast("좋아요를 반영하지 못했어요.", "bad");
  });
}
function gRefocus(sel){ var b = gViewEl[gView] && gViewEl[gView].querySelector(sel); if (b) b.focus(); }
function gOpenForm(kind){
  if (kind === "schedule") gForms.schedule = { days: [gSDay], time: "", title: "", desc: "", kind: "guild", errs: {} };
  else gForms[kind] = { title: "", body: "", author: gGet("guild-author", ""), links: [""], errs: {} };
  gRenderView();
  var f = gViewEl[gView].querySelector(".g-form .g-in, .g-form .g-pick button"); if (f) f.focus();
}

/* ---------- 이벤트 ---------- */
Object.keys(gViewEl).forEach(function(key){
  var el = gViewEl[key];
  el.addEventListener("click", function(e){
    var b = e.target.closest("[data-g]"); if (!b) return;
    var g = b.getAttribute("data-g"), kk = b.getAttribute("data-k"), id = b.getAttribute("data-id");
    if (g === "write") { if (kk !== "tips" && !admin) return; return gOpenForm(kk); }
    if (g === "cancel") { gForms[kk] = null; return gRenderView(); }
    if (g === "submit") return gSubmit(kk);
    if (g === "like") return gToggleLike(kk, id);
    if (g === "del") {
      if (!admin) return;
      var col = kk === "n" ? "notices" : "tips";
      openPanel('<h3>이 글을 삭제할까요?</h3><p class="hint">삭제하면 모든 길드원 화면에서 사라지고 되돌릴 수 없어요.</p>', "삭제", function(){
        gRemove(col, id).then(function(){ toast("삭제했어요.", "ok"); }, function(err){ toast(gErrMsg(err), "bad"); });
      });
      return;
    }
    if (g === "old") { gOpenOld[id] = !gOpenOld[id]; gRenderView(true); return gRefocus('[data-g="old"][data-id="' + id + '"]'); }
    if (g === "sort") { gTipSort = b.getAttribute("data-v"); gRenderView(true); return gRefocus('[data-g="sort"][data-v="' + gTipSort + '"]'); }
    if (g === "addlink") { gForms.tips.links.push(""); gRenderForm(); var ls = el.querySelectorAll("[data-gl]"); if (ls.length) ls[ls.length - 1].focus(); return; }
    if (g === "rmlink") { gForms.tips.links.splice(+b.getAttribute("data-i"), 1); gForms.tips.errs = {}; return gRenderForm(); }
    if (g === "sday") { gSDay = +b.getAttribute("data-i"); gRenderView(true); return gRefocus('[data-g="sday"][data-i="' + gSDay + '"]'); }
    if (g === "sweek") { gSWeek = b.getAttribute("data-v") === "1"; gRenderView(true); return gRefocus('[data-g="sweek"][data-v="' + (gSWeek ? 1 : 0) + '"]'); }
    if (g === "pick") { var d = gForms.schedule, i = +b.getAttribute("data-i"), at = d.days.indexOf(i); if (at >= 0) d.days.splice(at, 1); else d.days.push(i); d.errs.days = ""; gRenderForm(); return gRefocus('[data-g="pick"][data-i="' + i + '"]'); }
    if (g === "kind") { gForms.schedule.kind = b.getAttribute("data-v"); gRenderForm(); return gRefocus('[data-g="kind"][data-v="' + gForms.schedule.kind + '"]'); }
    if (g === "introedit" && admin) { gForms.schedule = null; gIntroEdit = gSched.intro || G_INTRO; gRenderView(); var t = document.getElementById("gf-intro"); if (t) t.focus(); return; }
    if (g === "introcancel") { gIntroEdit = null; return gRenderView(); }
    if (g === "introsave" && admin) {
      var v = (document.getElementById("gf-intro").value || "").trim();
      gSaveSched({ intro: v, events: gSched.events }, "소개 문구를 저장했어요.").then(function(){ gIntroEdit = null; gRenderView(); }, function(){});
      return;
    }
    if (g === "evedit" && admin) {
      var ev = null; gSched.events.forEach(function(x){ if (x.id === id) ev = x; }); if (!ev) return;
      gIntroEdit = null;
      gForms.schedule = { id: ev.id, days: ev.days.slice(), time: ev.time, title: ev.title, desc: ev.desc || "", kind: ev.kind || "etc", errs: {} };
      gRenderView(); window.scrollTo(0, 0); return;
    }
    if (g === "evdel" && admin) {
      openPanel('<h3>이 일정을 삭제할까요?</h3><p class="hint">선택된 모든 요일에서 함께 지워져요.</p>', "삭제", function(){
        gSaveSched({ intro: gSched.intro, events: gSched.events.filter(function(x){ return x.id !== id; }) }, "일정을 삭제했어요.").then(function(){ if (!LIVE) gRenderView(); }, function(){});
      });
    }
  });
  el.addEventListener("change", function(e){
    if (e.target.getAttribute("data-g") === "showboss") { gShowBoss = e.target.checked; gRenderView(true); gRefocus('[data-g="showboss"]'); }
  });
  el.addEventListener("input", function(e){
    var f = e.target.getAttribute("data-gf"), kk = e.target.getAttribute("data-k"), li = e.target.getAttribute("data-gl");
    if (f && gForms[kk]) {
      gForms[kk][f] = e.target.value;
      if (gForms[kk].errs[f]) { gForms[kk].errs[f] = ""; e.target.classList.remove("bad"); var er = document.getElementById(e.target.id + "-err"); if (er) er.textContent = ""; }
    }
    if (li != null && gForms.tips) gForms.tips.links[+li] = e.target.value;
  });
});
window.addEventListener("beforeunload", function(e){
  var busy = (gForms.notice && (gForms.notice.title || gForms.notice.body)) || (gForms.tips && (gForms.tips.title || gForms.tips.body));
  if (busy) { e.preventDefault(); e.returnValue = ""; }
});

/* 첫 화면 */
app.hidden = gView !== "boss";
Object.keys(gViewEl).forEach(function(key){ gViewEl[key].hidden = key !== gView; });
if (gView !== "boss") gRenderView();
gRenderNav();

/* ---------- 자동 업데이트: 새 버전이 올라오면 알아서 새로고침 ---------- */
var lastUpdCheck = 0;
function autoUpdate(force){
  var t = Date.now();
  if (!force && t - lastUpdCheck < 60000) return; // 1분에 한 번까지만 확인
  lastUpdCheck = t;
  fetch(location.pathname + "?vcheck=" + t, { cache: "no-store" }).then(function(r){ return r.ok ? r.text() : ""; }).then(function(txt){
    var m = txt.match(/var BUILD = "([^"]+)"/); if (!m) return;
    latestBuild = m[1]; buildChecked = true;
    var el = document.getElementById("verBox"); if (el) el.innerHTML = verHtml();
    if (m[1] <= BUILD) return;                                  // 지금 보는 게 최신
    if (dirty || dlg.open || editing() || gForms.notice || gForms.tips || gForms.schedule || gIntroEdit !== null) return; // 작성·수정 중이면 다음에 다시
    var tried = null; try { tried = sessionStorage.getItem("boss-upd"); } catch (e) {}
    if (tried === m[1]) return;                                  // 같은 버전으로는 한 번만 시도
    try { sessionStorage.setItem("boss-upd", m[1]); } catch (e) {}
    // 주소에 버전을 붙여 옛 파일을 건너뛰고, #notice 같은 메뉴 주소는 그대로 유지
    location.replace(location.pathname + "?v=" + m[1].replace(/\D/g, "") + location.hash);
  }).catch(function(){});
}

render();
setInterval(tick, 1000);
setTimeout(function(){ autoUpdate(true); }, 3000);
setInterval(function(){ autoUpdate(true); }, 5 * M);
document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") autoUpdate(); });
window.addEventListener("pageshow", function(e){ if (e.persisted) autoUpdate(true); });
syncClock(); setInterval(syncClock, 10 * M);
})();
</script>
</body>
</html>
